<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculator</title><link rel="stylesheet" href="style.css"></head>
<body><main class="calc" aria-label="Calculator">
<div class="screen"><div id="expr" class="expr"></div><div id="display" class="disp">0</div></div>
<div class="keys">
<button data-a="clear" class="fn">AC</button><button data-a="back" class="fn">&#9003;</button><button data-a="percent" class="fn">%</button><button data-op="/" class="op">&divide;</button>
<button data-n="7">7</button><button data-n="8">8</button><button data-n="9">9</button><button data-op="*" class="op">&times;</button>
<button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button><button data-op="-" class="op">&minus;</button>
<button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button><button data-op="+" class="op">+</button>
<button data-n="0" class="zero">0</button><button data-n=".">.</button><button data-a="eq" class="eq">=</button>
</div></main><script src="script.js"></script></body></html>
