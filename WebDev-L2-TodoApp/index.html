<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>To-Do App</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><h1>My To-Do List</h1>
<form id="add"><input id="title" type="text" placeholder="Add a new task..." maxlength="120" autocomplete="off"><button type="submit">Add</button></form>
<div id="err" class="err" role="alert"></div>
<section><h2>Pending <span id="pc" class="count">0</span></h2><ul id="pending"></ul></section>
<section><h2>Completed <span id="dc" class="count">0</span></h2><ul id="done"></ul></section>
</main><script src="script.js"></script></body></html>
