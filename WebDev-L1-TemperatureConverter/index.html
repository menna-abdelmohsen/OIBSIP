<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temperature Converter</title><link rel="stylesheet" href="style.css"></head>
<body><main class="card"><h1>Temperature Converter</h1><p class="sub">Convert between Celsius, Fahrenheit and Kelvin</p>
<form id="form" novalidate>
<label for="value">Temperature</label><input id="value" type="text" inputmode="decimal" placeholder="Enter a number" autocomplete="off">
<div class="msg" id="error" role="alert"></div>
<label for="unit">From unit</label>
<select id="unit"><option value="C">Celsius (&deg;C)</option><option value="F">Fahrenheit (&deg;F)</option><option value="K">Kelvin (K)</option></select>
<button type="submit" id="convert">Convert</button></form>
<div id="result" class="hidden" aria-live="polite"></div></main>
<script src="script.js"></script></body></html>
